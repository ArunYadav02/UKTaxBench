[project]
name = "uktaxbench"
version = "0.1.0"
description = "A contamination-resistant benchmark for UK personal tax reasoning in LLMs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
models = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
uktaxbench = "uktaxbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
